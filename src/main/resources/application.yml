server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: always

sift:
  pcap-file: src/main/resources/pcaps/mixed_traffic.pcap
  flow-table-capacity: 50000
  alert-ring-buffer-capacity: 500
  pipeline-queue-capacity: 10000
  pipeline-worker-count: 4
  syn-flood-z-score-threshold: 3.0
  port-scan-window-seconds: 10
  port-scan-unique-port-threshold: 20
  rabbit-mq-host: localhost
  rabbit-mq-port: 5672
  alert-log-file: sift-alerts.jsonl
  loadgen:
    profile: MIXED
    total-packets: 1000000
    rate-per-second: 50000
    normal-percent: 70
    syn-flood-percent: 20
    port-scan-percent: 7
    dns-tunnel-percent: 3
    worker-threads: 4

logging:
  level:
    com.sift: INFO
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health
  metrics:
    distribution:
      percentiles-histogram:
        sift.packet.processing.latency: true
      percentiles:
        sift.packet.processing.latency: 0.5,0.95,0.99